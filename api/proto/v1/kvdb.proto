syntax = "proto3";

package kvdb.v1;

option go_package = "kvdb/internal/protocol/pb;pb";

// Operation identifies a database command.
enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_PING = 1;
  OPERATION_GET = 2;
  OPERATION_SET = 3;
  OPERATION_SETNX = 4;
  OPERATION_DEL = 5;
  OPERATION_TTL = 6;
  OPERATION_EXPIRE = 7;
  OPERATION_KEYS = 8;
}

// Status describes the result of a command.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  STATUS_NOT_FOUND = 2;
  STATUS_NOT_SET = 3;

  STATUS_BAD_REQUEST = 16;
  STATUS_UNKNOWN_OPCODE = 17;
  STATUS_UNSUPPORTED_VERSION = 18;
  STATUS_TOO_LARGE = 19;
  STATUS_INVALID_ARGUMENT = 20;
  STATUS_REQUEST_CONFLICT = 21;
  STATUS_SERVER_BUSY = 22;

  STATUS_INTERNAL_ERROR = 127;
}

// Packet is one complete UDP message.
//
// Exactly one body variant must be present.
// The serialized Packet must not exceed 1400 bytes.
message Packet {
  // KVDB protocol version. Current version: 1.
  uint32 version = 1;

  // Identifies the client session.
  uint64 client_id = 2;

  // Identifies one logical request.
  uint64 request_id = 3;

  // Order of requests within the client session.
  uint32 sequence = 4;

  // Database operation.
  Operation op = 5;

  // Message type is determined by the active oneof field.
  oneof body {
    Request request = 10;
    Response response = 11;
    Ack ack = 12;
  }
}

// Request contains command arguments.
message Request {
  // GET, SET, SETNX, DEL, TTL, EXPIRE.
  bytes key = 1;

  // SET and SETNX.
  bytes value = 2;

  // SET, SETNX and EXPIRE.
  // For SET/SETNX, zero means no expiration.
  uint64 ttl_ms = 3;

  // KEYS regular expression.
  string pattern = 4;

  // Reserved for future KEYS pagination.
  uint64 cursor = 5;
  uint32 limit = 6;
}

// Response contains the result of command execution.
message Response {
  Status status = 1;

  // GET result.
  bytes value = 2;

  // TTL result.
  // -1 means the key has no expiration.
  sint64 ttl_ms = 3;

  // DEL result: 0 or 1.
  uint64 deleted = 4;

  // KEYS result.
  repeated bytes keys = 5;

  // Error description.
  string message = 6;
}

// Ack confirms that a request was accepted.
//
// ACK does not mean the database operation has completed.
// The final result is always sent in Response.
message Ack {}
